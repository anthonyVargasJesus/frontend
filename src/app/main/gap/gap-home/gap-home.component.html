<div class="content-wrapper">
    <div class="content-body">
        <app-content-header [contentHeader]="contentHeader"></app-content-header>

        <div class="gap-home">

            <div class="gap-home__body" *ngIf="!loading; else cargando">

                <app-gap-breach-map [evaluation]="evaluation" [stats]="stats" [temaRows]="temaRows"
                    [maturityLevels]="maturityLevels" [totalEvidencias]="totalEvidencias"
                    [legendCounts]="legendCounts">
                </app-gap-breach-map>

                <input type="search" class="gap-home__search" [(ngModel)]="searchText"
                    placeholder="Buscar por código o nombre..." />

                <app-gap-theme-filter [temas]="temas" [filtroTema]="filtroTema"
                    (filtroTemaChange)="filtroTema = $event">
                </app-gap-theme-filter>

                <app-gap-evaluation-item *ngFor="let item of pageItems; trackBy: trackByItem" [tipo]="item.tipo"
                    [theme]="item.theme" [evaluacion]="item.evaluacion" [standardId]="standardId"
                    [evaluationId]="evaluationId" [maturityLevelsInput]="maturityLevels"
                    [responsiblesInput]="responsibles" (updateEvent)="onUpdate()">
                </app-gap-evaluation-item>

                <div class="text-muted text-center mt-3" *ngIf="pageItems.length === 0 && !loadingMore">
                    No hay ítems que coincidan con la búsqueda o el filtro.
                </div>

                <!-- Sentinel: cuando entra en viewport (ver ngAfterViewInit), pide la siguiente
                     página. Vacío en el DOM, solo marca el final de la lista cargada. -->
                <div #scrollSentinel></div>

                <div class="text-center py-3" *ngIf="loadingMore">
                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                </div>

            </div>

            <ng-template #cargando>
                <div class="text-center py-5">
                    <div class="spinner-grow text-primary" role="status"></div>
                </div>
            </ng-template>

        </div>
    </div>
</div>
